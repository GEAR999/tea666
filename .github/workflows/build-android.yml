name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:  # 允许手动触发

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: pnpm install

      - name: Copy web assets to www
        run: |
          mkdir -p www
          cp index.html www/
          cp -r styles www/
          cp -r js www/
          cp -r data www/
          cp manifest.json www/
          cp sw.js www/
          cp icon-*.png www/

      - name: Sync Capacitor
        run: |
          npx cap sync android || echo "Capacitor sync failed, continuing with existing android project"

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          # 增加 Gradle 内存
          export GRADLE_OPTS="-Xmx2048m"
          export _JAVA_OPTIONS="-Xmx2048m"
          # 显示 Gradle 版本
          ./gradlew --version
          # 清理并构建 debug APK
          ./gradlew clean
          ./gradlew assembleDebug --info 2>&1 | tee build.log
          # 显示构建结果
          echo "构建完成，检查输出..."
          find . -name "*.apk" -type f

      - name: Find APK
        run: |
          echo "查找 APK 文件..."
          find android -name "*.apk" -type f
          APK_PATH=$(find android -name "*.apk" -type f | head -1)
          echo "找到 APK: $APK_PATH"
          echo "APK_PATH=$APK_PATH" >> $GITHUB_ENV

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: paoyin-baike-apk
          path: ${{ env.APK_PATH }}
          retention-days: 30

      - name: Create Release
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v1
        with:
          files: android/app/build/outputs/apk/debug/app-debug.apk
          tag_name: v${{ github.run_number }}
          name: 泡饮百科 v${{ github.run_number }}
          body: |
            自动构建的 Android APK
            
            版本：v${{ github.run_number }}
            构建时间：${{ github.event.head_commit.timestamp }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
