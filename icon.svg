<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8FB87E;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6B8E5B;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.2"/>
    </filter>
  </defs>
  
  <!-- 背景圆角矩形 -->
  <rect width="512" height="512" rx="100" fill="url(#bg)" filter="url(#shadow)"/>
  
  <!-- 茶杯轮廓 -->
  <g transform="translate(256, 220)">
    <!-- 杯身 -->
    <path d="M -80,-40 L -60,60 Q -50,80 0,80 Q 50,80 60,60 L 80,-40 Z" 
          fill="none" stroke="#FAF7F0" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- 杯把手 -->
    <path d="M 80,-20 Q 110,-20 110,10 Q 110,40 80,40" 
          fill="none" stroke="#FAF7F0" stroke-width="8" stroke-linecap="round"/>
    
    <!-- 热气 -->
    <path d="M -30,-60 Q -25,-75 -20,-60 Q -15,-45 -10,-60" 
          fill="none" stroke="#FAF7F0" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
    <path d="M 0,-65 Q 5,-80 10,-65 Q 15,-50 20,-65" 
          fill="none" stroke="#FAF7F0" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
    <path d="M 30,-60 Q 35,-75 40,-60 Q 45,-45 50,-60" 
          fill="none" stroke="#FAF7F0" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
  </g>
  
  <!-- 茶叶装饰 -->
  <g transform="translate(256, 380)">
    <path d="M -40,0 Q -20,-20 0,-10 Q 20,0 40,-10" 
          fill="none" stroke="#FAF7F0" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
    <path d="M -30,10 Q -10,-5 10,5 Q 30,15 50,5" 
          fill="none" stroke="#FAF7F0" stroke-width="3" stroke-linecap="round" opacity="0.4"/>
  </g>
</svg>
